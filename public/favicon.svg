<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Saladier et cuillère</title>
  <rect width="512" height="512" rx="64" fill="#A35F12"/>
  <!-- saladier : contour + pâte -->
