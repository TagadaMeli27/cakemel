    <path d="M104 290 H408"/>
    <path d="M104 290 A152 152 0 0 0 408 290"/>
  </g>
  <path d="M131 376 Q194 350 256 376 T381 376 A152 152 0 0 1 131 376 Z" fill="#FFFAF2"/>
  <circle cx="196" cy="404" r="8" fill="#A35F12"/>
  <circle cx="300" cy="410" r="8" fill="#A35F12"/>
  <!-- éclaboussures -->
